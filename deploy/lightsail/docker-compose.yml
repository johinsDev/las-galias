# Producción en una sola instancia (AWS Lightsail / EC2).
# Strapi + Postgres + Caddy (HTTPS automático) en la misma máquina.
# Uso: docker compose --env-file .env up -d --build   (ver scripts/deploy.sh)

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME} -d ${DATABASE_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10

  cms:
    # La imagen la compila GitHub Actions y esta caja solo la descarga. Compilar
    # aquí el panel de Strapi necesita ~2 GB y la instancia tiene 2 GB: tiraba de
    # swap, el I/O wait subía al 96%, sshd dejaba de responder y el despliegue
    # moría a mitad dejando el CMS abajo. Descargar son segundos.
    #
    # `build` se queda para poder compilar a mano en local si hiciera falta;
    # `up -d` usa la imagen local si existe y si no la baja del registro.
    image: ghcr.io/johinsdev/las-galias-cms:${CMS_IMAGE_TAG:-latest}
    build:
      # El Dockerfile necesita el monorepo completo → contexto = raíz del repo.
      context: ../..
      dockerfile: apps/cms/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "1337"
      IS_PROXIED: "true" # detrás de Caddy → confía en X-Forwarded-*
      # Secrets de Strapi (genera cada uno con: openssl rand -base64 32)
      APP_KEYS: ${APP_KEYS}
      API_TOKEN_SALT: ${API_TOKEN_SALT}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET}
      TRANSFER_TOKEN_SALT: ${TRANSFER_TOKEN_SALT}
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      # Base de datos (Postgres del compose, misma máquina)
      DATABASE_CLIENT: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_SSL: "false"
      # Uploads a S3 (mismo bucket/estrategia que ya usa el CMS)
      UPLOADS_BUCKET: ${UPLOADS_BUCKET}
      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      # Rebuild del sitio en Vercel al publicar
      VERCEL_DEPLOY_HOOK_URL: ${VERCEL_DEPLOY_HOOK_URL}
      # Asistente de preguntas (IA). Vacío = el bot no puede responder, aunque
      # esté encendido en el admin. Se llama directo a Anthropic.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Orígenes que pueden llamar al CMS desde un navegador. Vacío = "*", que es
      # lo que necesita hoy el sitio (vive en una URL *.vercel.app que cambia).
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # Providers (Sinco/manual)
      PROJECT_DATA_PROVIDER: ${PROJECT_DATA_PROVIDER:-manual}
      LEAD_PROVIDER: ${LEAD_PROVIDER:-manual}
      SINCO_BASE_URL: ${SINCO_BASE_URL:-}
      SINCO_USER: ${SINCO_USER:-}
      SINCO_PASSWORD: ${SINCO_PASSWORD:-}
      SINCO_ID_ORIGEN: ${SINCO_ID_ORIGEN:-}
      SINCO_ID_EMPRESA: ${SINCO_ID_EMPRESA:-}
      SINCO_ID_SUCURSAL: ${SINCO_ID_SUCURSAL:-1}
    volumes:
      # Sin esto, CADA despliegue borra todas las imágenes. El proveedor local de
      # Strapi las escribe dentro del contenedor, y reemplazar el contenedor
      # (que es lo que hace un despliegue) se lleva su sistema de archivos por
      # delante. Pasó: los proyectos quedaron con las fotos rotas.
      #
      # Lo definitivo es S3 — el compose ya pasa UPLOADS_BUCKET y las credenciales
      # y el CMS cambia de proveedor solo cuando esas variables tienen valor —,
      # pero mientras esos buckets no existan, el volumen es lo que evita la
      # pérdida.
      - cms_uploads:/app/apps/cms/public/uploads
    expose:
      - "1337" # solo visible para Caddy, no al exterior

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - cms
    ports:
      - "80:80"
      - "443:443"
    environment:
      CMS_DOMAIN: ${CMS_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  cms_uploads:
  caddy_data:
  caddy_config:
